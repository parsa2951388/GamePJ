<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1714"><title>بنرها و تخت‌ها</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<style>
:root{--bg:#1b1714;--pn:#262019;--ln:#6b5636;--gd:#e2b45c;--tx:#eadfc8;--mu:#a09379;--no:#e0735c}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.7 Vazirmatn,Tahoma,sans-serif;padding-bottom:72px}
#app{max-width:560px;margin:auto;padding:8px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:10px;margin:8px 0}
h3{margin:0 0 6px;color:var(--gd);font-size:15px}.mu{color:var(--mu)}.no{color:var(--no)}
button{font:inherit;background:#3a2e20;color:var(--gd);border:1px solid var(--ln);border-radius:4px;padding:6px 12px}
button:disabled{opacity:.4}
input{font:inherit;background:#15110e;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:6px;width:100%;min-width:0}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between}.r input{flex:1}
.g3,.g4{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g3 .pn,.g4 .pn{margin:0;padding:6px;text-align:center}
nav{position:fixed;inset:auto 0 0;display:flex;background:#120f0c;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);font-size:12px;padding:12px 2px}
nav .on{color:var(--gd);box-shadow:inset 0 3px var(--gd)}
#mp{display:grid;grid-template-columns:repeat(15,1fr);gap:1px;direction:ltr;background:#2c3a1a;border:1px solid var(--ln)}
#mp i{aspect-ratio:1;background:#566b32}
#mp .b{background:#8a6a40}#mp .m{background:#3d86d6}#mp .e{background:#cf4a3a}#mp .o{background:#0e0c0a}#mp .s{outline:2px solid #fff;outline-offset:-2px}
#t{position:fixed;top:12px;inset-inline:12px;background:#000d;border:1px solid var(--gd);padding:8px;border-radius:4px;text-align:center;z-index:9}
</style></head><body>
<div id="app"></div><div id="t" hidden></div><nav hidden></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),f=n=>Math.floor(n).toLocaleString('en');
const BN={hall:'تالار شهر',lumber:'چوب‌بری',gold:'معدن طلا',iron:'معدن آهن',farm:'مزرعه',store:'انبار',wall:'دیوار',barracks:'پادگان',stable:'اصطبل'};
const UN={pike:'نیزه‌دار',guard:'نگهبان',raider:'غارتگر',knight:'شوالیه'};
const RI=['🪵','🪙','🔩'],RK=['w','g','i'];
const TB=[['map','نقشه'],['chat','گفتگو'],['village','روستا'],['attack','حمله'],['recruit','سربازگیری'],['build','ساخت']];
let tok=localStorage.tok||'',S=null,tab='village',skew=0,ll=0,mc=null,md=null,sl=null,chat=[];
const cd=ms=>{let s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const cs=c=>c.map((x,i)=>`<span class="${S.r[RK[i]]>=x?'':'no'}">${RI[i]}${f(x)}</span>`).join(' ');
const L=o=>Object.entries(o).map(([k,n])=>n+' '+UN[k]).join('، ')||'—';
const LOGIN=`<div class="pn" style="margin-top:12vh"><h3>بنرها و تخت‌ها</h3><p class="mu">روستایتان را بسازید، ارتش آموزش دهید و جهان را فتح کنید.</p><input id="un" placeholder="نام کاربری" autocomplete="username"><br><br><input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password"><br><br><div class="r"><button onclick="auth('login')">ورود</button><button onclick="auth('register')">ثبت‌نام</button></div></div>`;

async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401){tok='';S=null;localStorage.removeItem('tok');draw()}if(!r.ok)throw d.e||'خطا';return d}
function toast(m){const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const sync=()=>{skew=S.now-Date.now();S.t0=Date.now()};
async function act(p,b){try{S=await api(p,b);sync();draw()}catch(e){toast(e)}}
async function load(){ll=Date.now();try{S=await api('state');sync();if(tab==='chat')chat=(await api('chat')).c;draw()}catch(e){if(!S)draw()}}
async function auth(p){try{const d=await api(p,{name:$('#un').value.trim(),pw:$('#pw').value});tok=d.tok;localStorage.tok=tok;await load()}catch(e){toast(e)}}

const ql=()=>(S.q.length?`<div class="pn"><h3>صف ساخت</h3>${S.q.map(q=>`<div class="r"><span>${BN[q.b]}: سطح ${q.lvl}</span><b data-e="${q.end}"></b></div>`).join('')}</div>`:'')
 +(S.rq.length?`<div class="pn"><h3>صف آموزش سربازان</h3>${S.rq.map(r=>`<div class="r"><span>${r.n} ${UN[r.u]}</span><b data-e="${r.end}"></b></div>`).join('')}</div>`:'');
const rp=r=>`<div style="border-top:1px solid var(--ln);padding:6px 0"><b class="${r.win?'':'no'}">${r.win?'✅ پیروزی مهاجم':'❌ شکست مهاجم'}</b> <small class="mu">${r.a} ← ${r.d}</small><br><small>تلفات مهاجم: ${L(r.al)}<br>تلفات مدافع: ${L(r.dl)}<br>غنیمت: ${r.loot.map((x,i)=>RI[i]+f(x)).join(' ')}</small></div>`;
const V={
 village:()=>(S.inc.length?`<div class="pn" style="border-color:var(--no)"><h3 class="no">⚠ حمله در راه است</h3>${S.inc.map(m=>`<div class="r"><span>از ${m.from}</span><b data-e="${m.at}"></b></div>`).join('')}</div>`:'')
  +`<div class="pn"><h3>ساختمان‌ها</h3><div class="g3">${Object.keys(BN).map(k=>`<div class="pn"><small class="mu">${BN[k]}</small><br><b>${S.b[k]}</b></div>`).join('')}</div></div>`
  +`<div class="pn"><h3>سپاه در روستا</h3>${S.ul.map(u=>`${UN[u.k]}: <b>${u.n}</b>`).join(' &nbsp; ')}</div>`+ql(),
 build:()=>ql()+S.bl.map(b=>`<div class="pn"><div class="r"><b>${BN[b.k]}</b><span class="mu">سطح ${b.l}${b.nl-1>b.l?' ← '+(b.nl-1):''}</span></div><div class="r"><small>${cs(b.c)} ⏱${cd(b.t*1000)}</small><button ${b.mx?'disabled':''} onclick="act('build',{b:'${b.k}'})">${b.mx?'حداکثر':'ارتقا به '+b.nl}</button></div></div>`).join(''),
 recruit:()=>ql()+S.ul.map(u=>`<div class="pn"><div class="r"><b>${UN[u.k]}</b><small class="mu">${u.n} عدد</small></div><small class="mu">⚔${u.a} 🛡${u.d} 🏃${u.s}د 🎒${u.l} 👥${u.p}</small><div class="r"><small>${cs(u.c)} ⏱${cd(u.t*1000)}</small></div><div class="r"><input id="ru_${u.k}" type="number" min="1" inputmode="numeric" placeholder="تعداد"><button ${u.ok?'':'disabled'} onclick="rec('${u.k}')">${u.ok?'آموزش':BN[u.h]+' '+u.r}</button></div></div>`).join(''),
 attack:()=>`<div class="pn"><h3>ارسال سپاه</h3><input id="to" placeholder="مختصات مقصد مثل 60:55">`+S.ul.map(u=>`<div class="r" style="margin-top:6px"><span>${UN[u.k]} <small class="mu">${u.n}</small></span><input id="at_${u.k}" type="number" min="0" style="max-width:90px"><button onclick="$('#at_${u.k}').value=${u.n}">همه</button></div>`).join('')+`<br><button onclick="send()" style="width:100%">⚔ حمله</button></div>`
  +(S.mv.length?`<div class="pn"><h3>سپاه در حرکت</h3>${S.mv.map(m=>`<div class="r"><span>${m.k==='a'?'⚔ به '+m.to:'↩ بازگشت '+m.loot.map((x,i)=>RI[i]+f(x)).join(' ')}</span><b data-e="${m.at}"></b></div>`).join('')}</div>`:'')
  +`<div class="pn"><h3>گزارش‌ها</h3>${S.rep.length?S.rep.slice(0,10).map(rp).join(''):'<small class="mu">هنوز گزارشی نیست</small>'}</div>`,
 map:()=>`<div class="pn"><div class="r"><input id="gx" placeholder="x:y"><button onclick="gom()">برو</button></div></div><div id="mp"></div><div class="r" style="margin:6px 0"><button onclick="pan(0,-6)">⬆</button><button onclick="pan(0,6)">⬇</button><button onclick="pan(-6,0)">⬅</button><button onclick="pan(6,0)">➡</button></div><div class="pn" id="info"></div>`,
 chat:()=>`<div class="pn" id="cl" style="height:46vh;overflow:auto">${chat.map(c=>`<div><b style="color:var(--gd)">${esc(c.u)}</b> ${esc(c.m)}</div>`).join('')||'<small class="mu">هنوز پیامی نیست</small>'}</div><div class="r"><input id="cm" maxlength="200" placeholder="پیام..." onkeydown="event.key=='Enter'&&sendc()"><button onclick="sendc()">ارسال</button></div>`
};
function keep(fn){const v={},a=document.activeElement&&document.activeElement.id;document.querySelectorAll('#app input').forEach(i=>{if(i.id)v[i.id]=i.value});fn();
 for(const k in v){const e=document.getElementById(k);if(e)e.value=v[k]}if(a){const e=document.getElementById(a);if(e)e.focus()}}
function draw(){const nav=$('nav');nav.hidden=!S;if(!S){$('#app').innerHTML=LOGIN;return}
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 keep(()=>{$('#app').innerHTML=`<div class="pn"><div class="r"><b>${esc(S.n)} <small class="mu">${S.x}:${S.y}</small></b><small id="clk" class="mu"></small></div></div><div class="g4" id="res"></div>`+V[tab]()});
 if(tab==='map')paint();if(tab==='chat'){const e=$('#cl');e.scrollTop=e.scrollHeight}tick()}
function tick(){if(!S)return;const k=(Date.now()-S.t0)/36e5,now=Date.now()+skew;
 const r=$('#res');if(r)r.innerHTML=RK.map((x,i)=>`<div class="pn">${RI[i]} ${f(Math.min(S.cap,S.r[x]+S.prod[x]*k))}<br><small class="mu">+${f(S.prod[x])}/س</small></div>`).join('')+`<div class="pn">👥 ${S.pop[0]}/${S.pop[1]}<br><small class="mu">انبار ${f(S.cap)}</small></div>`;
 const c=$('#clk');if(c)c.textContent=new Date(now).toLocaleTimeString('en-GB');
 let due=false;document.querySelectorAll('[data-e]').forEach(e=>{const d=+e.dataset.e-now;e.textContent=cd(d);if(d<=0)due=true});
 if(due&&Date.now()-ll>3000)load()}
function go(t){tab=t;if(t==='map'){mc=mc||[S.x,S.y];loadMap()}draw();if(t==='chat')load()}
function rec(k){const i=$('#ru_'+k),n=+i.value;i.value='';act('recruit',{u:k,n})}
function send(){const tr={};S.ul.forEach(u=>{const n=+$('#at_'+u.k).value;if(n>0)tr[u.k]=n});act('attack',{to:$('#to').value,tr})}
async function sendc(){const i=$('#cm'),m=i.value;i.value='';try{chat=(await api('chat',{m})).c;draw()}catch(e){toast(e)}}
const cl=n=>Math.max(0,Math.min(md?md.size-1:119,n));
async function loadMap(){try{md=await api(`map?x=${mc[0]}&y=${mc[1]}`);if(tab==='map')paint()}catch(e){toast(e)}}
function pan(dx,dy){mc=[cl(mc[0]+dx),cl(mc[1]+dy)];loadMap()}
function gom(){const [x,y]=$('#gx').value.split(':').map(Number);if(isNaN(x)||isNaN(y))return toast('مختصات نامعتبر');mc=[cl(x),cl(y)];loadMap()}
function goA(c){tab='attack';draw();$('#to').value=c}
function paint(){const e=$('#mp');if(!md||!mc||!e)return;const m={};md.v.forEach(v=>m[v.x+':'+v.y]=v);let h='';
 for(let y=mc[1]-8;y<=mc[1]+8;y++)for(let x=mc[0]-7;x<=mc[0]+7;x++){const v=m[x+':'+y],o=x<0||y<0||x>=md.size||y>=md.size;
  h+=`<i data-x="${x}" data-y="${y}" class="${o?'o':v?(v.o===S.n?'m':v.o?'e':'b'):''} ${sl&&sl[0]===x&&sl[1]===y?'s':''}"></i>`}
 e.innerHTML=h;e.onclick=ev=>{const d=ev.target.dataset;if(d.x!==undefined){sl=[+d.x,+d.y];paint()}};
 const i=$('#info');if(!sl){i.innerHTML='<small class="mu">روی یک خانه بزنید. آبی: شما · قرمز: بازیکن دیگر · قهوه‌ای: شورشیان</small>';return}
 const v=m[sl[0]+':'+sl[1]];
 i.innerHTML=v?`<b>${esc(v.n)}</b> <small class="mu">${v.x}:${v.y}</small><br>${v.o?'مالک: '+esc(v.o):'شورشیان (قابل غارت)'} · امتیاز ${v.p}<br>فاصله: ${Math.hypot(v.x-S.x,v.y-S.y).toFixed(1)}${v.o===S.n?'':`<br><button onclick="goA('${v.x}:${v.y}')">⚔ ارسال سپاه</button>`}`:`<small class="mu">${sl[0]}:${sl[1]} — خالی</small>`}
$('nav').innerHTML=TB.map(([k,n])=>`<button data-t="${k}" onclick="go('${k}')">${n}</button>`).join('');
setInterval(tick,1000);setInterval(()=>{if(S&&!document.hidden)load()},6000);
if(tok)load();else draw();
</script></body></html>
